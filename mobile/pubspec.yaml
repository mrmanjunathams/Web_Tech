name: bloggerbytes
description: "Bloggerbytes mobile app: read, write and publish stories with covers from the Image Pool."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.1.2
  http: ^1.6.0
  intl: ^0.20.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  flutter_quill: ^11.6.0
  vsc_quill_delta_to_html: ^1.0.5
  flutter_quill_delta_from_html: ^1.5.3
  flutter_widget_from_html_core: ^0.17.4
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  url_launcher_platform_interface: ^2.3.2
  share_plus_platform_interface: ^7.2.0
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/picyourpic/
    - assets/picyourpic/opt/
