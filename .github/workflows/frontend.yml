# Checks the Angular web app (frontend/) on every push: unit tests with 100% coverage, then a production build.
name: Frontend

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Unit tests with 100% coverage (statements, branches, functions, lines)
        run: npm run test:coverage

      - name: Production build (type-checks templates, checks the icon font)
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: bloggerbytes-web-${{ github.sha }}
          path: frontend/dist/frontend/browser
          retention-days: 14
